# TEMPORARY: PaddleOCR-VL benchmark. Remove before merging.
name: Diag
on:
  push:
    branches: ['feature/character-speakers']
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pillow huggingface_hub
      - run: |
          names=$(gh release view -R ggml-org/llama.cpp --json assets -q '.assets[].name' 2>&1 || true)
          echo "::notice title=assets::$(echo "$names" | tr '\n' ' ' | cut -c1-1500)"
          asset=$(echo "$names" | grep -iE 'ubuntu-x64\.(zip|tar\.gz)$' | head -1 || true)
          echo "::notice title=asset::$asset"
          gh release download -R ggml-org/llama.cpp --pattern "$asset" -O pkg
          mkdir raw && (unzip -q pkg -d raw 2>/dev/null || tar -xzf pkg -C raw)
          bin=$(dirname "$(find raw -name 'llama-mtmd-cli' -type f | head -1)")
          echo "bin=$bin"
          mkdir llama && cp -r "$bin"/* llama/
      - run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          shutil.copy(hf_hub_download("PaddlePaddle/PaddleOCR-VL-1.6-GGUF", "PaddleOCR-VL-1.6-GGUF.gguf"), "m.gguf")
          shutil.copy(hf_hub_download("PaddlePaddle/PaddleOCR-VL-1.6-GGUF", "PaddleOCR-VL-1.6-GGUF-mmproj.gguf"), "mm.gguf")
          PY
      - run: |
          export LD_LIBRARY_PATH=$PWD/llama
          ./llama/llama-mtmd-cli -m m.gguf --mmproj mm.gguf --image .github/diag/t2.png -p "OCR:" --temp 0 -n 256 2>&1 | tail -5
      - run: LD_LIBRARY_PATH=$PWD/llama python .github/diag/paddle_bench.py
