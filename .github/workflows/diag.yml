# TEMPORARY: Koharu's own PaddleOCR-VL path on the reference blocks.
name: Diag
on:
  push:
    branches: ['feature/character-speakers']
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - run: pip install numpy pillow huggingface_hub
      - run: python .github/diag/make_crops.py
      - run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil, os
          os.makedirs("paddle", exist_ok=True)
          for f in ["PaddleOCR-VL-1.6-GGUF.gguf", "PaddleOCR-VL-1.6-GGUF-mmproj.gguf"]:
              shutil.copy(hf_hub_download("PaddlePaddle/PaddleOCR-VL-1.6-GGUF", f), "paddle/" + f)
          PY
      - name: build
        run: cargo build --release -p koharu-llm --bin paddleocr-vl-llm 2>&1 | tail -3
      - name: run
        run: |
          for f in crops/*.png; do
            out=$(./target/release/paddleocr-vl-llm --cpu --model-dir paddle --max-new-tokens 256 --input "$f" 2>err.txt | grep -v '^== ' | tr -d '\n')
            if [ -z "$out" ]; then echo "::notice title=ERR $f::$(tail -c 600 err.txt | tr '\n' ' ')"; else echo "::notice title=$f::$out"; fi
          done
