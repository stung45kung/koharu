# TEMPORARY: OCR experiments. Remove before merging.
name: Diag
on:
  push:
    branches: ['feature/character-speakers']
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch manga-ocr
      - run: python .github/diag/ocr_probe.py
