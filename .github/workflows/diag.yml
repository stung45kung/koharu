# TEMPORARY: surfaces clippy errors as annotations. Remove before merging.
name: Diag

on:
  push:
    branches: ['feature/character-speakers']

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --message-format=short -- -D warnings > raw.txt 2>&1 || true
          grep -E '(error|warning)(\[|:)' raw.txt | head -40 | while IFS= read -r line; do echo "::error title=diag::${line//%/%25}"; done
