# TEMPORARY: surfaces errors as annotations. Remove before merging.
name: Diag

on:
  push:
    branches: ['feature/character-speakers']

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo check --workspace --all-targets --message-format=short > raw.txt 2>&1 || true
          cargo clippy --message-format=short -- -D warnings >> raw.txt 2>&1 || true
          grep -E '(error|warning)(\[|:)' raw.txt | grep -v 'proc-macro-error2' | head -40 | while IFS= read -r line; do echo "::error title=diag::${line//%/%25}"; done
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          cd ui
          bunx tsc --noEmit -p . 2>&1 | head -30 | while IFS= read -r line; do echo "::error title=tsc::${line//%/%25}"; done
          bunx vitest run --reporter=github-actions --reporter=dot || true
