name: Diag
on:
  push:
    branches: ['feat/library-select-all']
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          cd ui
          bunx vitest run tests/components/LibraryDialog.test.tsx tests/lib/pickSet.test.ts --reporter=github-actions || true
