# Fork release: Windows installer (NSIS setup.exe) + portable exe, published
# as a GitHub Release of stung45kung/koharu.
#
# Trigger: push a tag like `v0.61.3-th` (or run manually from the Actions
# tab and give the tag). Release notes come from .github/release-notes.md.
#
# Unlike upstream there is no code signing (Windows SmartScreen will warn
# on first run) and no auto-update feed.
name: Release

on:
  push:
    tags:
      - 'v*-th*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create / release (e.g. v0.61.3-th)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
          log-file-suffix: 'windows-release.txt'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: bun install
      - name: Release name and notes
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EOF'
            cat .github/release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Koharu TH ${{ steps.meta.outputs.tag }}
          releaseBody: ${{ steps.meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadPlainBinary: true
